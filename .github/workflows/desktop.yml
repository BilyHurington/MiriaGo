name: Desktop Launcher

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: miriago-desktop-windows
            platform-name: windows-x64
          - os: macos-latest
            artifact-name: miriago-desktop-macos
            platform-name: macos
          - os: ubuntu-22.04
            artifact-name: miriago-desktop-linux
            platform-name: linux-x64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          fuse_package=libfuse2
          if ! apt-cache show "$fuse_package" >/dev/null 2>&1; then
            fuse_package=libfuse2t64
          fi
          sudo apt-get install -y --no-install-recommends \
            appmenu-gtk-module \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            "$fuse_package" \
            xdg-utils \
            zip

      - name: Install dependencies
        run: |
          flutter pub get
          npm install

      - name: Read app version
        shell: bash
        run: |
          version_line="$(grep '^version:' pubspec.yaml | head -n 1)"
          app_version="${version_line#version: }"
          app_version="${app_version%%+*}"
          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"
          echo "ZIP_NAME=MiriaGo-v$app_version-${{ matrix.platform-name }}.zip" >> "$GITHUB_ENV"

      - name: Analyze Flutter
        run: flutter analyze --no-pub

      - name: Build Flutter Web
        run: npm run build:web:desktop

      - name: Build Tauri desktop app
        if: runner.os != 'Linux'
        run: npm run desktop:build

      - name: Build Tauri Linux desktop app
        if: runner.os == 'Linux'
        run: npm run desktop:build:linux

      - name: Package macOS zip
        if: runner.os == 'macOS'
        run: |
          app_path="src-tauri/target/release/bundle/macos/MiriaGo.app"
          package_dir="dist/desktop/MiriaGo-macos"
          if [ ! -d "$app_path" ]; then
            echo "Missing macOS app bundle: $app_path" >&2
            exit 1
          fi

          codesign --force --deep --sign - "$app_path"
          codesign --verify --deep --strict --verbose=4 "$app_path"

          rm -rf dist/desktop
          mkdir -p "$package_dir"
          cp -R "$app_path" "$package_dir/"
          codesign --verify --deep --strict --verbose=4 "$package_dir/MiriaGo.app"
          ditto -c -k --sequesterRsrc --keepParent "$package_dir" "dist/desktop/$ZIP_NAME"

      - name: Package Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exePath = "src-tauri\target\release\miriago-desktop.exe"
          $packageDir = "dist\desktop\MiriaGo-windows"
          if (!(Test-Path $exePath)) {
            throw "Missing Windows executable: $exePath"
          }

          if (Test-Path "dist\desktop") {
            Remove-Item "dist\desktop" -Recurse -Force
          }
          New-Item -ItemType Directory -Path "$packageDir\MiriaGoData" -Force | Out-Null
          Copy-Item $exePath "$packageDir\MiriaGo.exe"
          Compress-Archive -Path $packageDir -DestinationPath "dist\desktop\$env:ZIP_NAME" -Force

          $setupPath = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if ($null -eq $setupPath) {
            throw "Missing Windows NSIS installer"
          }
          Copy-Item $setupPath.FullName "dist\desktop\MiriaGo-v$env:APP_VERSION-windows-x64-setup.exe"

      - name: Package Linux zip
        if: runner.os == 'Linux'
        run: |
          exe_path="src-tauri/target/release/miriago-desktop"
          package_dir="dist/desktop/MiriaGo-linux"
          if [ ! -x "$exe_path" ]; then
            echo "Missing Linux executable: $exe_path" >&2
            exit 1
          fi

          rm -rf dist/desktop
          mkdir -p "$package_dir/MiriaGoData"
          cp "$exe_path" "$package_dir/MiriaGo"
          chmod +x "$package_dir/MiriaGo"
          (cd dist/desktop && zip -r "$ZIP_NAME" "MiriaGo-linux")

          shopt -s nullglob
          for bundle in src-tauri/target/release/bundle/appimage/*.AppImage; do
            cp "$bundle" "dist/desktop/MiriaGo-v$APP_VERSION-linux-x64.AppImage"
          done
          for bundle in src-tauri/target/release/bundle/deb/*.deb; do
            cp "$bundle" "dist/desktop/MiriaGo-v$APP_VERSION-linux-x64.deb"
          done
          for bundle in src-tauri/target/release/bundle/rpm/*.rpm; do
            cp "$bundle" "dist/desktop/MiriaGo-v$APP_VERSION-linux-x64.rpm"
          done

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            dist/desktop/*.zip
            dist/desktop/*.exe
            dist/desktop/*.AppImage
            dist/desktop/*.deb
            dist/desktop/*.rpm

      - name: Attach desktop artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/desktop/*.zip
            dist/desktop/*.exe
            dist/desktop/*.AppImage
            dist/desktop/*.deb
            dist/desktop/*.rpm
